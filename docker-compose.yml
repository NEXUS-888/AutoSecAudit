services:
  autosec:
    build: .
    container_name: autosecaudit
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    environment:
      - AUTOSEC_MOCK_MODE=true
      - AUTOSEC_LOG_LEVEL=INFO
    command: server
    restart: unless-stopped
    depends_on:
      - juice-shop

  cli:
    build: .
    container_name: autosec_cli
    volumes:
      - ./data:/app/data
    environment:
      - AUTOSEC_MOCK_MODE=false
    command: scan
    profiles:
      - cli
    depends_on:
      - juice-shop

  # OWASP Juice Shop — live test target for vulnerability scanning
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: juice-shop
    ports:
      - "3000:3000"
    restart: unless-stopped