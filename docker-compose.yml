services:
  autosec:
    build: .
    container_name: autosecaudit
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./data:/app/data
    environment:
      - AUTOSEC_HOST=0.0.0.0
      - AUTOSEC_ADMIN_PASSWORD=${AUTOSEC_ADMIN_PASSWORD:?set AUTOSEC_ADMIN_PASSWORD}
      - AUTOSEC_MOCK_MODE=true
      - AUTOSEC_LOG_LEVEL=INFO
    command: server
    restart: unless-stopped
    depends_on:
      - juice-shop

  cli:
    build: .
    container_name: autosec_cli
    volumes:
      - ./data:/app/data
    environment:
      - AUTOSEC_MOCK_MODE=false
    command: scan
    profiles:
      - cli
    depends_on:
      - juice-shop

  # OWASP Juice Shop — live test target for vulnerability scanning
  juice-shop:
    image: bkimminich/juice-shop:v17.1.1
    container_name: juice-shop
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped