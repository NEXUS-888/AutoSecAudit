name: AutoSecAudit Security Scan Example

# Example GitHub Actions CI/CD workflow demonstrating automated vulnerability
# scanning with AutoSecAudit, SARIF upload to GitHub Code Scanning, and JUnit reporting.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 1'  # Run weekly on Monday at 02:00 UTC

jobs:
  security-audit:
    name: Run AutoSecAudit DAST Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write  # Required for uploading SARIF to GitHub Code Scanning

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install AutoSecAudit Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Application Under Test (Loopback)
        run: |
          # Start your web application service or testbed on loopback / private IP
          # Replace with your app startup command (e.g. gunicorn, npm start, docker, etc.)
          python -m http.server 8080 &
          sleep 2

      - name: Execute AutoSecAudit Scan with SARIF and JUnit Outputs
        run: |
          python main.py scan http://127.0.0.1:8080 \
            --real \
            --sarif autosec-report.sarif \
            --junit autosec-junit.xml \
            --fail-on high

      - name: Upload SARIF to GitHub Code Scanning Alerts
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: autosec-report.sarif
          category: autosecaudit-dast

      - name: Archive Assessment Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autosec-security-reports
          path: |
            autosec-report.sarif
            autosec-junit.xml
            data/reports/*.json
            data/reports/*.html
